name: mono_repo
description: >-
  CLI tools to make it easier to manage a single source repository containing
  multiple Dart packages.
version: 6.7.0
repository: https://github.com/google/mono_repo.dart

topics:
  - tool
  - repository-management

environment:
  sdk: ^3.8.0

dependencies:
  args: ^2.0.0
  checked_yaml: ^2.0.1
  collection: ^1.19.0
  graphs: ^2.2.0
  io: ^1.0.0
  json_annotation: ^4.9.0
  meta: ^1.15.0
  path: ^1.9.0
  pub_semver: ^2.1.4
  pubspec_parse: ^1.4.0
  yaml: ^3.1.2

dev_dependencies:
  build_runner: ^2.5.0
  build_test: ^3.0.0
  build_verify: ^3.0.0
  build_version: ^2.0.3
  json_serializable: ^6.9.2
  term_glyph: ^1.2.0
  test: ^1.25.9
  test_descriptor: ^2.0.0
  test_process: ^2.0.0

executables:
  mono_repo:
