# Created with package:mono_repo v1.2.3
name: "package:pkg_name"
on:
  push:
    branches:
      - "main"
      - "master"
    paths:
      - ".github/workflows/sub_pkg.yaml"
      - "sub_pkg/**"
      - "pubspec.yaml"
  pull_request:
    paths:
      - ".github/workflows/sub_pkg.yaml"
      - "sub_pkg/**"
      - "pubspec.yaml"
defaults:
  run:
    shell: "bash"
env:
  PUB_ENVIRONMENT: "bot.github"
permissions: "read-all"


jobs:
  job_001:
    name: "analyze; osx; Dart dev; `dart analyze --fatal-infos`, `dart format --output=none --set-exit-if-changed .`"
    runs-on: "macos-latest"
    steps:
      - name: "Cache Pub hosted dependencies"
        uses: "actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7"
        with:
          path: "~/.pub-cache/hosted"
          key: "os:macos-latest;pub-cache-hosted;sdk:dev;packages:sub_pkg;commands:analyze-format"
          restore-keys: |-
            os:macos-latest;pub-cache-hosted;sdk:dev;packages:sub_pkg
            os:macos-latest;pub-cache-hosted;sdk:dev
            os:macos-latest;pub-cache-hosted
            os:macos-latest
      - name: "Setup Dart SDK"
        uses: "dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260"
        with:
          sdk: "dev"
      - id: "checkout"
        name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"
        with:
          persist-credentials: false
      - id: "sub_pkg_pub_upgrade"
        name: "dart pub upgrade"
        run: "dart pub upgrade"
        if: "always() && steps.checkout.conclusion == 'success'"
        working-directory: "sub_pkg"
      - name: "dart analyze --fatal-infos"
        run: "dart analyze --fatal-infos"
        if: "always() && steps.sub_pkg_pub_upgrade.conclusion == 'success'"
        working-directory: "sub_pkg"
      - name: "dart format --output=none --set-exit-if-changed ."
        run: "dart format --output=none --set-exit-if-changed ."
        if: "always() && steps.sub_pkg_pub_upgrade.conclusion == 'success'"
        working-directory: "sub_pkg"
  job_002:
    name: "analyze; windows; Dart 1.23.0; `dart analyze --fatal-infos`"
    runs-on: "windows-latest"
    steps:
      - name: "Setup Dart SDK"
        uses: "dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260"
        with:
          sdk: "1.23.0"
      - id: "checkout"
        name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"
        with:
          persist-credentials: false
      - id: "sub_pkg_pub_upgrade"
        name: "dart pub upgrade"
        run: "dart pub upgrade"
        if: "always() && steps.checkout.conclusion == 'success'"
        working-directory: "sub_pkg"
      - name: "dart analyze --fatal-infos"
        run: "dart analyze --fatal-infos"
        if: "always() && steps.sub_pkg_pub_upgrade.conclusion == 'success'"
        working-directory: "sub_pkg"
  job_003:
    name: "unit_test; linux; `dart test --preset travis`"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Cache Pub hosted dependencies"
        uses: "actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7"
        with:
          path: "~/.pub-cache/hosted"
          key: "os:ubuntu-latest;pub-cache-hosted;sdk:${{ matrix.sdk }};packages:sub_pkg;commands:test_1"
          restore-keys: |-
            os:ubuntu-latest;pub-cache-hosted;sdk:${{ matrix.sdk }};packages:sub_pkg
            os:ubuntu-latest;pub-cache-hosted;sdk:${{ matrix.sdk }}
            os:ubuntu-latest;pub-cache-hosted
            os:ubuntu-latest
      - name: "Setup Dart SDK"
        uses: "dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260"
        with:
          sdk: "${{ matrix.sdk }}"
      - id: "checkout"
        name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"
        with:
          persist-credentials: false
      - id: "sub_pkg_pub_upgrade"
        name: "dart pub upgrade"
        run: "dart pub upgrade"
        if: "always() && steps.checkout.conclusion == 'success'"
        working-directory: "sub_pkg"
      - name: "dart test --preset travis"
        run: "dart test --preset travis"
        if: "always() && steps.sub_pkg_pub_upgrade.conclusion == 'success'"
        working-directory: "sub_pkg"
    needs:
      - "job_001"
      - "job_002"
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - "1.23.0"
          - "dev"
          - "stable"
  job_004:
    name: "unit_test; linux; chrome tests"
    runs-on: "ubuntu-latest"
