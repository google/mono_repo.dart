          restore-keys: |-
            os:ubuntu-latest;pub-cache-hosted;sdk:${{ matrix.sdk }};packages:sub_pkg
            os:ubuntu-latest;pub-cache-hosted;sdk:${{ matrix.sdk }}
            os:ubuntu-latest;pub-cache-hosted
            os:ubuntu-latest
      - name: "Setup Dart SDK"
        uses: "dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260"
        with:
          sdk: "${{ matrix.sdk }}"
      - id: "checkout"
        name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"
        with:
          persist-credentials: false
      - id: "sub_pkg_pub_upgrade"
        name: "dart pub upgrade"
        run: "dart pub upgrade"
        if: "always() && steps.checkout.conclusion == 'success'"
        working-directory: "sub_pkg"
      - name: "dart test --platform chrome"
        run: "dart test --platform chrome"
        if: "always() && steps.sub_pkg_pub_upgrade.conclusion == 'success'"
        working-directory: "sub_pkg"
    needs:
      - "job_001"
      - "job_002"
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - "1.23.0"
          - "dev"
          - "stable"
  job_005:
    name: "unit_test; windows; `dart test --preset travis`"
    runs-on: "windows-latest"
    steps:
      - name: "Setup Dart SDK"
        uses: "dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260"
        with:
          sdk: "${{ matrix.sdk }}"
      - id: "checkout"
        name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"
        with:
          persist-credentials: false
      - id: "sub_pkg_pub_upgrade"
        name: "dart pub upgrade"
        run: "dart pub upgrade"
        if: "always() && steps.checkout.conclusion == 'success'"
        working-directory: "sub_pkg"
      - name: "dart test --preset travis"
        run: "dart test --preset travis"
        if: "always() && steps.sub_pkg_pub_upgrade.conclusion == 'success'"
        working-directory: "sub_pkg"
    needs:
      - "job_001"
      - "job_002"
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - "1.23.0"
          - "dev"
          - "stable"
  job_006:
    name: "unit_test; windows; chrome tests"
    runs-on: "windows-latest"
    steps:
      - name: "Setup Dart SDK"
        uses: "dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260"
        with:
          sdk: "${{ matrix.sdk }}"
      - id: "checkout"
        name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"
        with:
          persist-credentials: false
      - id: "sub_pkg_pub_upgrade"
        name: "dart pub upgrade"
        run: "dart pub upgrade"
        if: "always() && steps.checkout.conclusion == 'success'"
        working-directory: "sub_pkg"
      - name: "dart test --platform chrome"
        run: "dart test --platform chrome"
        if: "always() && steps.sub_pkg_pub_upgrade.conclusion == 'success'"
        working-directory: "sub_pkg"
    needs:
      - "job_001"
      - "job_002"
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - "1.23.0"
