      - name: "Setup flutter package"
        uses: "./.github/actions/setup-flutter"
        with:
          channel: "master"
          working-directory: "test_flutter_pkg"
      - run: "dart format --output=none --set-exit-if-changed ."
        working-directory: "test_flutter_pkg"
      - run: "flutter analyze --fatal-infos --fatal-infos ."
        working-directory: "test_flutter_pkg"
  job_008:
    name: "test; linux; Dart 3.8.0; `dart test -P presubmit --test-randomize-ordering-seed=random`"
    runs-on: "ubuntu-latest"
    steps:
      - id: "checkout"
        name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"
        with:
          persist-credentials: false
      - name: "Setup dart package"
        uses: "./.github/actions/setup-dart"
        with:
          sdk: "3.8.0"
          working-directory: "mono_repo"
      - run: "dart test -P presubmit --test-randomize-ordering-seed=random"
        working-directory: "mono_repo"
    needs:
      - "job_001"
      - "job_002"
      - "job_003"
      - "job_004"
      - "job_005"
      - "job_006"
      - "job_007"
  job_009:
    name: "test; linux; Flutter beta; `flutter test --test-randomize-ordering-seed=random`"
    runs-on: "ubuntu-latest"
    steps:
      - id: "checkout"
        name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"
        with:
          persist-credentials: false
      - name: "Setup flutter package"
        uses: "./.github/actions/setup-flutter"
        with:
          channel: "beta"
          working-directory: "test_flutter_pkg"
      - run: "flutter test --test-randomize-ordering-seed=random"
        working-directory: "test_flutter_pkg"
    needs:
      - "job_001"
      - "job_002"
      - "job_003"
      - "job_004"
      - "job_005"
      - "job_006"
      - "job_007"
  job_010:
    name: "test; linux; Dart dev; `dart pub global run coverage:test_with_coverage -- --test-randomize-ordering-seed=random`"
    runs-on: "ubuntu-latest"
    steps:
      - id: "checkout"
        name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"
        with:
          persist-credentials: false
      - name: "Setup dart package"
        uses: "./.github/actions/setup-dart"
        with:
          sdk: "dev"
          working-directory: "mono_repo"
      - name: "Activate package:coverage"
        run: "dart pub global activate coverage '>=1.5.0'"
      - run: "dart pub global run coverage:test_with_coverage -- --test-randomize-ordering-seed=random"
        working-directory: "mono_repo"
      - name: "Upload coverage to Coveralls"
        uses: "coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b"
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          path-to-lcov: "mono_repo/coverage/lcov.info"
          flag-name: "coverage_00"
          parallel: true
      - name: "Upload coverage to codecov.io"
        uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f"
        with:
          files: "mono_repo/coverage/lcov.info"
          fail_ci_if_error: false
          name: "coverage_00"
          token: "${{ secrets.CODECOV_TOKEN }}"
    needs:
      - "job_001"
      - "job_002"
      - "job_003"
      - "job_004"
      - "job_005"
      - "job_006"
      - "job_007"
  job_011:
    name: "test; linux; Dart dev; `dart pub global run coverage:test_with_coverage -- -P presubmit --test-randomize-ordering-seed=random`"
    runs-on: "ubuntu-latest"
    steps:
      - id: "checkout"
        name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"
        with:
          persist-credentials: false
      - name: "Setup dart package"
        uses: "./.github/actions/setup-dart"
        with:
