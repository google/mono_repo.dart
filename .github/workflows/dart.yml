# Created with package:mono_repo v6.7.2
name: "Dart CI"
on:
  push:
    branches:
      - "main"
      - "master"
  pull_request: null
  schedule:
    - cron: "0 0 * * 0"
defaults:
  run:
    shell: "bash"
env:
  PUB_ENVIRONMENT: "bot.github"
permissions:
  contents: "read"


jobs:
  job_001:
    name: "smoke_test; linux; `dart analyze --fatal-infos .`"
    runs-on: "ubuntu-latest"
    steps:
      - id: "checkout"
        name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"
        with:
          persist-credentials: false
      - name: "Setup dart package"
        uses: "./.github/actions/setup-dart"
        with:
          sdk: "${{ matrix.sdk }}"
          working-directory: "test_pkg"
      - run: "dart analyze --fatal-infos ."
        working-directory: "test_pkg"
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - "2.16.0"
          - "2.17.0-69.1.beta"
          - "2.18.0-106.0.dev"
          - "beta"
          - "dev"
          - "stable"
  job_002:
    name: "smoke_test; linux; Dart 3.8.0; `dart analyze --fatal-infos`"
    runs-on: "ubuntu-latest"
    steps:
      - id: "checkout"
        name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"
        with:
          persist-credentials: false
      - name: "Setup dart package"
        uses: "./.github/actions/setup-dart"
        with:
          sdk: "3.8.0"
          working-directory: "mono_repo"
      - run: "dart analyze --fatal-infos"
        working-directory: "mono_repo"
  job_003:
    name: "smoke_test; linux; `flutter analyze --fatal-infos .`"
    runs-on: "ubuntu-latest"
    steps:
      - id: "checkout"
        name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"
        with:
          persist-credentials: false
      - name: "Setup flutter package"
        uses: "./.github/actions/setup-flutter"
        with:
          channel: "${{ matrix.sdk }}"
          working-directory: "test_flutter_pkg"
      - run: "flutter analyze --fatal-infos ."
        working-directory: "test_flutter_pkg"
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - "beta"
          - "stable"
  job_004:
    name: "smoke_test; linux; Dart dev; `cd ../ && dart mono_repo/bin/mono_repo.dart generate --validate`"
    runs-on: "ubuntu-latest"
    steps:
      - id: "checkout"
        name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"
        with:
          persist-credentials: false
      - name: "Setup dart package"
        uses: "./.github/actions/setup-dart"
        with:
          sdk: "dev"
          working-directory: "mono_repo"
      - run: "cd ../ && dart mono_repo/bin/mono_repo.dart generate --validate"
        working-directory: "mono_repo"
  job_005:
    name: "smoke_test; linux; Dart dev; `dart format --output=none --set-exit-if-changed .`, `dart analyze --fatal-infos`"
    runs-on: "ubuntu-latest"
    steps:
      - id: "checkout"
        name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"
        with:
          persist-credentials: false
      - name: "Setup dart package"
        uses: "./.github/actions/setup-dart"
        with:
          sdk: "dev"
          working-directory: "mono_repo"
      - run: "dart format --output=none --set-exit-if-changed ."
        working-directory: "mono_repo"
      - run: "dart analyze --fatal-infos"
        working-directory: "mono_repo"
  job_006:
    name: "smoke_test; linux; Dart main; `dart format --output=none --set-exit-if-changed .`, `dart analyze --fatal-infos --fatal-infos .`"
    runs-on: "ubuntu-latest"
    steps:
      - id: "checkout"
        name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"
        with:
          persist-credentials: false
      - name: "Setup dart package"
        uses: "./.github/actions/setup-dart"
        with:
          sdk: "main"
          working-directory: "test_pkg"
      - run: "dart format --output=none --set-exit-if-changed ."
        working-directory: "test_pkg"
      - run: "dart analyze --fatal-infos --fatal-infos ."
        working-directory: "test_pkg"
  job_007:
    name: "smoke_test; linux; Flutter master; `dart format --output=none --set-exit-if-changed .`, `flutter analyze --fatal-infos --fatal-infos .`"
    runs-on: "ubuntu-latest"
    steps:
      - id: "checkout"
        name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"
