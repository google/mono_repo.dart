# Created with package:mono_repo v6.6.5-wip
name: "package:test_pkg"
on:
  push:
    branches:
      - "main"
      - "master"
    paths:
      - ".github/workflows/test_pkg.yaml"
      - "test_pkg/**"
      - "pubspec.yaml"
  pull_request:
    paths:
      - ".github/workflows/test_pkg.yaml"
      - "test_pkg/**"
      - "pubspec.yaml"
  schedule:
    - cron: "0 0 * * 0"
defaults:
  run:
    shell: "bash"
env:
  PUB_ENVIRONMENT: "bot.github"
permissions: "read-all"


jobs:
  job_001:
    name: "smoke_test; linux; `dart analyze`"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Cache Pub hosted dependencies"
        uses: "actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7"
        with:
          path: "~/.pub-cache/hosted"
          key: "os:ubuntu-latest;pub-cache-hosted;sdk:${{ matrix.sdk }};packages:test_pkg;commands:analyze_0"
          restore-keys: |-
            os:ubuntu-latest;pub-cache-hosted;sdk:${{ matrix.sdk }};packages:test_pkg
            os:ubuntu-latest;pub-cache-hosted;sdk:${{ matrix.sdk }}
            os:ubuntu-latest;pub-cache-hosted
            os:ubuntu-latest
      - name: "Setup Dart SDK"
        uses: "dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260"
        with:
          sdk: "${{ matrix.sdk }}"
      - id: "checkout"
        name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"
      - id: "test_pkg_pub_upgrade"
        name: "dart pub upgrade"
        run: "dart pub upgrade"
        if: "always() && steps.checkout.conclusion == 'success'"
        working-directory: "test_pkg"
      - name: "dart analyze"
        run: "dart analyze"
        if: "always() && steps.test_pkg_pub_upgrade.conclusion == 'success'"
        working-directory: "test_pkg"
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - "2.16.0"
          - "2.17.0-69.1.beta"
          - "2.18.0-106.0.dev"
          - "beta"
          - "dev"
          - "main"
  job_002:
    name: "smoke_test; linux; Dart stable; `dart format --output=none --set-exit-if-changed .`, `dart analyze --fatal-infos`"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Cache Pub hosted dependencies"
        uses: "actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7"
        with:
          path: "~/.pub-cache/hosted"
          key: "os:ubuntu-latest;pub-cache-hosted;sdk:stable;packages:test_pkg;commands:format-analyze_1"
          restore-keys: |-
            os:ubuntu-latest;pub-cache-hosted;sdk:stable;packages:test_pkg
            os:ubuntu-latest;pub-cache-hosted;sdk:stable
            os:ubuntu-latest;pub-cache-hosted
            os:ubuntu-latest
      - name: "Setup Dart SDK"
        uses: "dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260"
        with:
          sdk: "stable"
      - id: "checkout"
        name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"
      - id: "test_pkg_pub_upgrade"
        name: "dart pub upgrade"
        run: "dart pub upgrade"
        if: "always() && steps.checkout.conclusion == 'success'"
        working-directory: "test_pkg"
      - name: "dart format --output=none --set-exit-if-changed ."
        run: "dart format --output=none --set-exit-if-changed ."
        if: "always() && steps.test_pkg_pub_upgrade.conclusion == 'success'"
        working-directory: "test_pkg"
      - name: "dart analyze --fatal-infos"
        run: "dart analyze --fatal-infos"
        if: "always() && steps.test_pkg_pub_upgrade.conclusion == 'success'"
        working-directory: "test_pkg"
  job_003:
    name: "test; linux; `dart pub global run coverage:test_with_coverage -- --test-randomize-ordering-seed=random`"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Cache Pub hosted dependencies"
        uses: "actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7"
        with:
          path: "~/.pub-cache/hosted"
          key: "os:ubuntu-latest;pub-cache-hosted;sdk:${{ matrix.sdk }};packages:test_pkg;commands:test_with_coverage_0"
          restore-keys: |-
            os:ubuntu-latest;pub-cache-hosted;sdk:${{ matrix.sdk }};packages:test_pkg
            os:ubuntu-latest;pub-cache-hosted;sdk:${{ matrix.sdk }}
            os:ubuntu-latest;pub-cache-hosted
            os:ubuntu-latest
      - name: "Setup Dart SDK"
        uses: "dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260"
        with:
          sdk: "${{ matrix.sdk }}"
      - name: "Activate package:coverage"
        run: "dart pub global activate coverage '>=1.5.0'"
      - id: "checkout"
        name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"
      - id: "test_pkg_pub_upgrade"
        name: "dart pub upgrade"
        run: "dart pub upgrade"
        if: "always() && steps.checkout.conclusion == 'success'"
        working-directory: "test_pkg"
      - name: "dart pub global run coverage:test_with_coverage -- --test-randomize-ordering-seed=random"
        run: "dart pub global run coverage:test_with_coverage -- --test-randomize-ordering-seed=random"
        if: "always() && steps.test_pkg_pub_upgrade.conclusion == 'success'"
        working-directory: "test_pkg"
      - name: "Upload coverage to Coveralls"
        uses: "coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b"
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          path-to-lcov: "test_pkg/coverage/lcov.info"
          flag-name: "coverage_02"
          parallel: true
      - name: "Upload coverage to codecov.io"
        uses: "codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354"
        with:
          files: "test_pkg/coverage/lcov.info"
          fail_ci_if_error: false
          name: "coverage_02"
          token: "${{ secrets.CODECOV_TOKEN }}"
    needs:
      - "job_001"
      - "job_002"
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - "2.16.0"
          - "dev"
  job_004:
    name: "Notify failure"
    runs-on: "ubuntu-latest"
    if: "(github.event_name == 'push' || github.event_name == 'schedule') && failure()"
    steps:
      - run: |
          curl -H "Content-Type: application/json" -X POST -d \
            "{'text':'Build failed! ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}'}" \
            "${CHAT_WEBHOOK_URL}"
        env:
          CHAT_WEBHOOK_URL: "${{ secrets.CHAT_WEBHOOK_URL }}"
    needs:
      - "job_001"
      - "job_002"
      - "job_003"
  job_5:
    name: "Mark Coveralls job finished"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Mark Coveralls job finished"
        uses: "coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b"
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          parallel-finished: true
    needs:
      - "job_003"

