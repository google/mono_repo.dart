# Created with package:mono_repo v6.7.1
name: "package:test_flutter_pkg_example"
on:
  push:
    branches:
      - "main"
      - "master"
    paths:
      - ".github/workflows/test_flutter_pkg_example.yaml"
      - "test_flutter_pkg/example/**"
      - "test_flutter_pkg/**"
      - "pubspec.yaml"
  pull_request:
    paths:
      - ".github/workflows/test_flutter_pkg_example.yaml"
      - "test_flutter_pkg/example/**"
      - "test_flutter_pkg/**"
      - "pubspec.yaml"
  schedule:
    - cron: "0 0 * * 0"
defaults:
  run:
    shell: "bash"
env:
  PUB_ENVIRONMENT: "bot.github"
permissions: "read-all"


jobs:
  job_001:
    name: "test; linux; Flutter stable; `flutter test --test-randomize-ordering-seed=random`"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Cache Pub hosted dependencies"
        uses: "actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7"
        with:
          path: "~/.pub-cache/hosted"
          key: "os:ubuntu-latest;pub-cache-hosted;sdk:stable;packages:test_flutter_pkg/example;commands:test_2"
          restore-keys: |-
            os:ubuntu-latest;pub-cache-hosted;sdk:stable;packages:test_flutter_pkg/example
            os:ubuntu-latest;pub-cache-hosted;sdk:stable
            os:ubuntu-latest;pub-cache-hosted
            os:ubuntu-latest
      - name: "Setup Flutter SDK"
        uses: "subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2"
        with:
          channel: "stable"
      - id: "checkout"
        name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"
        with:
          persist-credentials: false
      - id: "test_flutter_pkg_example_pub_upgrade"
        name: "flutter pub upgrade"
        run: "flutter pub upgrade"
        if: "always() && steps.checkout.conclusion == 'success'"
        working-directory: "test_flutter_pkg/example"
      - name: "flutter test --test-randomize-ordering-seed=random"
        run: "flutter test --test-randomize-ordering-seed=random"
        if: "always() && steps.test_flutter_pkg_example_pub_upgrade.conclusion == 'success'"
        working-directory: "test_flutter_pkg/example"
  job_002:
    name: "Notify failure"
    runs-on: "ubuntu-latest"
    if: "(github.event_name == 'push' || github.event_name == 'schedule') && failure()"
    steps:
      - run: |
          curl -H "Content-Type: application/json" -X POST -d \
            "{'text':'Build failed! ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}'}" \
            "${CHAT_WEBHOOK_URL}"
        env:
          CHAT_WEBHOOK_URL: "${{ secrets.CHAT_WEBHOOK_URL }}"
    needs:
      - "job_001"

